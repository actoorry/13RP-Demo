server:
  port: 8080

spring:
  application:
    name: rd13-demo
  threads:
    virtual:
      enabled: true
  jackson:
    # 管理端实体默认 camelCase 序列化（前端 TS 类型/表单均为 camelCase 字段名）。
    # ⚠️ 不使用 SNAKE_CASE：全局命名策略会同时影响 @RequestBody 反序列化与 @ResponseBody 序列化，
    # 导致前端 camelCase 字段（applyNo/inquiryId 等）无法映射（新建 500、列表字段读不到）。
    # 决策演示接口返回 Map<String,Object>，Jackson 对 Map key 不做命名转换，不受影响；
    # PrecomputedData 读取 demo-data/*.json 已使用独立 ObjectMapper（默认命名策略）。
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://localhost:3306/boyu_demo?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      # 无密码，直接连接
  sql:
    init:
      # 每次启动执行 schema.sql + data.sql（均为幂等写法）
      mode: always
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 认证配置（secret 至少 32 字符；生产环境需外部化，通过环境变量 JWT_SECRET 注入，勿硬编码）
jwt:
  secret: ${JWT_SECRET:13RP-Boyu-Demo-JWT-Secret-Key-2026-0805-V04-HS256-0123456789}
  # token 有效期（小时）
  expire-hours: 12
  header: Authorization
  prefix: "Bearer "

demo:
  # 看板数据推送间隔（毫秒），MockDataService.generateAndPush 使用
  data-push-interval-ms: 1000

logging:
  level:
    com.boyu.demo: DEBUG
