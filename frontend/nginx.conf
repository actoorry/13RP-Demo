# ============================================================
# 13RP-Demo 前端 Nginx 配置
# 作为 /etc/nginx/conf.d/default.conf 挂载
# 前端容器通过服务名 backend 访问后端容器
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml font/ttf;

    # ---------- REST API 代理到后端容器 ----------
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- WebSocket 代理到后端容器（必须带 Upgrade 头） ----------
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 长连接：关闭缓冲、延长读超时（防止长连接被切断）
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ---------- 前端静态资源 / 路由兜底 ----------
    # 本项目使用 vue-router hash 模式，URL 变化只在 # 后，try_files 兜底更稳妥
    location / {
        try_files $uri $uri/ /index.html;
    }
}
